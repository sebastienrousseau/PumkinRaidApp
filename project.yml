name: PumkinRaid
options:
  bundleIdPrefix: com.sebastienrousseau
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: ""
targets:
  PumkinRaidCore:
    type: framework
    platform: iOS
    sources:
      - path: Sources/PumkinRaidCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sebastienrousseau.PumkinRaidCore
        GENERATE_INFOPLIST_FILE: YES
        DEFINES_MODULE: YES
  PumkinRaid:
    type: application
    platform: iOS
    sources:
      - path: Sources/PumkinRaid
        excludes:
          - Resources
      - path: Sources/PumkinRaid/Resources
        buildPhase: resources
    dependencies:
      - target: PumkinRaidCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sebastienrousseau.PumkinRaid
        PRODUCT_NAME: PumkinRaid
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: PumkinRaid
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.games
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: NO
    scheme:
      testTargets:
        - PumkinRaidCoreTests
  PumkinRaidCoreTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/PumkinRaidCoreTests
    dependencies:
      - target: PumkinRaidCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sebastienrousseau.PumkinRaidCoreTests
        GENERATE_INFOPLIST_FILE: YES
