name: PumkinRaidApp
options:
  bundleIdPrefix: com.sebastienrousseau
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: ""
targets:
  GameEngineLib:
    type: framework
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources/GameEngineLib
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sebastienrousseau.GameEngineLib
        GENERATE_INFOPLIST_FILE: YES
        DEFINES_MODULE: YES
  PumkinRaidApp:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources/PumkinRaidApp
        excludes: [Resources]
      - path: Sources/PumkinRaidApp/Resources
        buildPhase: resources
    dependencies:
      - target: GameEngineLib
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sebastienrousseau.PumkinRaidApp
        PRODUCT_NAME: PumkinRaidApp
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Pumkin Raid
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.games
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: NO
    scheme:
      testTargets: [GameEngineLibTests]
  GameEngineLibTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Tests/GameEngineLibTests
    dependencies:
      - target: GameEngineLib
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sebastienrousseau.GameEngineLibTests
        GENERATE_INFOPLIST_FILE: YES
