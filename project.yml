name: PumkinRaidApp
options:
  bundleIdPrefix: com.sebastienrousseau
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
    tvOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: ""
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 1.0.0
    ENABLE_USER_SCRIPT_SANDBOXING: YES
packages:
  GameEngineLib:
    url: https://github.com/sebastienrousseau/GameEngineLib.git
    from: 0.4.1
targetTemplates:
  PumkinRaidApplication:
    type: application
    sources:
      - path: Sources/PumkinRaidApp
        excludes: [Resources]
      - path: Sources/PumkinRaidApp/Resources
        buildPhase: resources
    dependencies:
      - package: GameEngineLib
    settings:
      base:
        PRODUCT_NAME: PumkinRaidApp
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Pumkin Raid
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.games
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: NO
targets:
  PumkinRaidApp-iOS:
    templates: [PumkinRaidApplication]
    platform: iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sebastienrousseau.PumkinRaidApp
        CODE_SIGN_ENTITLEMENTS: Configuration/Apple.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        TARGETED_DEVICE_FAMILY: "1,2"
  PumkinRaidApp-tvOS:
    templates: [PumkinRaidApplication]
    platform: tvOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sebastienrousseau.PumkinRaidApp.tvOS
        CODE_SIGN_ENTITLEMENTS: Configuration/Apple.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        TARGETED_DEVICE_FAMILY: "3"
  PumkinRaidApp-macOS:
    templates: [PumkinRaidApplication]
    platform: macOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sebastienrousseau.PumkinRaidApp.macOS
        CODE_SIGN_ENTITLEMENTS: Configuration/macOS.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.games
        MACOSX_DEPLOYMENT_TARGET: "14.0"
