name: PumkinRaidApp
options:
  bundleIdPrefix: com.sebastienrousseau
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: ""
packages:
  GameEngineLib:
    url: https://github.com/sebastienrousseau/GameEngineLib.git
    from: 0.1.0
targets:
  PumkinRaidApp:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources/PumkinRaidApp
        excludes: [Resources]
      - path: Sources/PumkinRaidApp/Resources
        buildPhase: resources
    dependencies:
      - package: GameEngineLib
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sebastienrousseau.PumkinRaidApp
        PRODUCT_NAME: PumkinRaidApp
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Pumkin Raid
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.games
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: NO
