name: Swift

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: swift-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version
      - name: Build release
        run: swift build -c release
      - name: Test application services
        run: ./Scripts/check-coverage.sh
      - name: Enforce Swift formatting
        run: swift format lint --strict --recursive Sources Tests
      - name: Validate privacy manifest
        run: plutil -lint Sources/PumkinRaidApp/Resources/PrivacyInfo.xcprivacy
      - name: Validate localization parity
        run: ./Scripts/validate-localizations.sh
      - name: Compile iOS host
        run: |
          IOS_SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          swift build --scratch-path .build/ios \
            --triple arm64-apple-ios17.0 --sdk "$IOS_SDK"
      - name: Compile tvOS host
        run: |
          TVOS_SDK="$(xcrun --sdk appletvos --show-sdk-path)"
          swift build --scratch-path .build/tvos \
            --triple arm64-apple-tvos17.0 --sdk "$TVOS_SDK"
      - name: Generate distribution project
        run: brew install xcodegen && xcodegen generate
      - name: Build unsigned iOS/iPadOS Release app
        run: |
          xcodebuild -quiet -project PumkinRaidApp.xcodeproj \
            -scheme PumkinRaidApp-iOS -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath .build/xcode-ios \
            -clonedSourcePackagesDirPath .build/xcode-packages \
            CODE_SIGNING_ALLOWED=NO build
      - name: Build unsigned tvOS Release app
        run: |
          xcodebuild -quiet -project PumkinRaidApp.xcodeproj \
            -scheme PumkinRaidApp-tvOS -configuration Release \
            -destination 'generic/platform=tvOS' \
            -derivedDataPath .build/xcode-tvos \
            -clonedSourcePackagesDirPath .build/xcode-packages \
            CODE_SIGNING_ALLOWED=NO build
      - name: Build unsigned macOS Release app
        run: |
          xcodebuild -quiet -project PumkinRaidApp.xcodeproj \
            -scheme PumkinRaidApp-macOS -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath .build/xcode-macos \
            -clonedSourcePackagesDirPath .build/xcode-packages \
            CODE_SIGNING_ALLOWED=NO build
      - name: Verify pure Swift sources
        run: |
          if find Sources -type f \( -name '*.c' -o -name '*.cc' -o -name '*.cpp' -o -name '*.m' -o -name '*.mm' \) | grep -q .; then
            echo 'Non-Swift source detected under Sources/'
            exit 1
          fi

  web-build-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: Platforms/Web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: Platforms/Web/package-lock.json
      - name: Install official Swift WebAssembly SDK
        run: >-
          swift sdk install
          https://download.swift.org/swift-6.3.3-release/wasm-sdk/swift-6.3.3-RELEASE/swift-6.3.3-RELEASE_wasm.artifactbundle.tar.gz
          --checksum cabfa08b73bb8ac783927ecd15fa386e99d0c139c5f232445067bcf58379cae7
      - name: Install Wasm optimizer
        run: sudo apt-get update && sudo apt-get install -y binaryen
      - name: Build optimized HTML5 release
        env:
          SWIFT_WASM_SDK: swift-6.3.3-RELEASE_wasm
        run: ./Scripts/build.sh
      - name: Audit web dependencies
        run: npm audit --audit-level=low
      - name: Install browser test engines
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Cross-browser input smoke test
        run: |
          npx vite preview --host 127.0.0.1 --port 8765 &
          npm run test:browsers
