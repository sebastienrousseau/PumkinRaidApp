<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#09060d">
  <title>Pumkin Raid</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="shell" aria-label="Pumkin Raid game">
    <canvas id="game"></canvas>
    <header class="hud" aria-live="polite">
      <span id="score">SCORE&nbsp;&nbsp;0</span><span id="lives">LIVES&nbsp;&nbsp;10</span>
    </header>
    <section id="menu" class="menu">
      <p class="eyebrow">A SWIFT GAME</p>
      <h1>PUMKIN<br><span>RAID</span></h1>
      <p>Guide the ghost. Dodge the raid.<br>Use arrows, WASD, touch, or mouse.</p>
      <button id="play" type="button">PLAY NOW</button>
    </section>
  </main>
</body>
</html>
